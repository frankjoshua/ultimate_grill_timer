plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('/home/josh/Documents/ultimate_grill_timer_digital_key/key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}


android {
    namespace = "com.tesseractmobile.ultimate_grill_timer"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.tesseractmobile.ultimate_grill_timer"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }


    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    // Two Play artifacts, one app: "phone" goes to the normal production track,
    // "wear" (watch feature + tile, versionCode offset) goes to the wear:production track.
    flavorDimensions = ["device"]
    productFlavors {
        phone {
            dimension "device"
        }
        wear {
            dimension "device"
            versionCode = flutterVersionCode.toInteger() + 100000
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Wear OS tile (GrillTileService)
    // 1.5/1.3 minimum: tiles 1.4 finds SysUI via a Settings read that
    // throws SecurityException on targetSdk 35+
    implementation "androidx.wear.tiles:tiles:1.5.0"
    implementation "androidx.wear.protolayout:protolayout:1.3.0"
    implementation "androidx.wear.protolayout:protolayout-expression:1.3.0"
    implementation "androidx.concurrent:concurrent-futures:1.2.0"
    // Phone <-> watch state sync (GrillSync / GrillDataListenerService)
    implementation "com.google.android.gms:play-services-wearable:19.0.0"
    testImplementation "junit:junit:4.13.2"
    // real org.json for JVM unit tests (android.jar ships stubs)
    testImplementation "org.json:json:20240303"
}
